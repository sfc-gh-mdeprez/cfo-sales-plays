<style>

  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
  img, svg, video { max-width: 100%; height: auto; }
  a { color: light-dark(#11567F, #6fd0f5); }
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(135deg, #0B2341 0%, #11567F 60%, #29B5E8 100%); }
  .gate form { background: #fff; color: #1f2937; border-radius: 14px; padding: clamp(24px, 5vw, 36px); width: min(400px, 100%); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .gate h1 { margin: 0 0 6px; font-size: 22px; color: #0B2341; }
  .gate p { margin: 0 0 18px; font-size: 14px; color: #5b6b7c; }
  .gate input { width: 100%; height: 44px; border: 1px solid #cdd7e1; border-radius: 8px; padding: 0 12px; font-size: 15px; }
  .gate button { margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 8px; background: #11567F; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .gate .err { color: #c0392b; font-size: 13px; min-height: 18px; margin-top: 10px; }
  #content { display: none; max-width: 980px; margin: 0 auto; padding: clamp(16px, 4vw, 32px); }
  .hero { background: linear-gradient(135deg, #0B2341 0%, #11567F 70%, #29B5E8 130%); color: #fff; border-radius: 16px; padding: clamp(22px, 5vw, 40px); }
  .brand { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; opacity: .95; }
  .brand .vf { color: #fff; border-left: 3px solid var(--red); padding-left: 10px; } .brand .x { opacity: .6; }
  .hero h1 { margin: 14px 0 8px; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.02em; }
  .lede { margin: 0; font-size: clamp(16px, 2.4vw, 19px); max-width: 720px; color: #d9ecf8; }
  .block { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 28px); margin-top: 18px; }
  h2 { margin: 0 0 12px; font-size: 21px; color: light-dark(#0B2341, #f1f6fb); }
  h3 { margin: 6px 0 6px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: light-dark(#f9fbfd, #102033); }
  .card p { margin: 0; font-size: 14px; color: var(--muted); }
  .ic { font-size: 22px; }
  .vwrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  .vwrap video { width: 100%; height: 100%; display: block; }
  .vload { position: absolute; inset: 0; display: grid; place-items: center; color: #cfe3f2; font-size: 14px; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .steps { margin: 0; padding-left: 20px; } .steps li { margin: 0 0 10px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: light-dark(#eef4f9, #1b3047); padding: 1px 5px; border-radius: 4px; }
  .presenter { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .presenter img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--blue); }
  .pn { font-size: 20px; font-weight: 700; } .pt { color: var(--muted); } .pc { margin-top: 4px; font-size: 14px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 22px 0 8px; }
</style>

  const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const expired = new Date() > new Date(CFG.expiry + "T23:59:59Z");
  const f = document.getElementById("f"), err = document.getElementById("err");
  if (expired) {
    document.getElementById("msg").textContent = "This preview expired on 22 November 2026. Contact mark.deprez@snowflake.com for a new link.";
    document.getElementById("pw").style.display = "none"; f.querySelector("button").style.display = "none";
    return;
  }
  async function key(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(CFG.salt), iterations: CFG.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function loadVideo(k) {
    const msg = document.getElementById("vload");
    try {
      const buf = new Uint8Array(await (await fetch("video.enc")).arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12), additionalData: new TextEncoder().encode("video") }, k, buf.slice(12));
      document.getElementById("vid").src = URL.createObjectURL(new Blob([plain], { type: "video/mp4" }));
      msg.remove();
    } catch (e) { msg.textContent = "The video could not be loaded. Please refresh the page."; }
  }
  f.addEventListener("submit", async function (e) {
    e.preventDefault(); err.textContent = "Checking…";
    try {
      const k = await key(document.getElementById("pw").value);
      const html = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(CFG.iv), additionalData: new TextEncoder().encode("html") }, k, ub(CFG.ct));
      const c = document.getElementById("content");
      c.innerHTML = new TextDecoder().decode(html);
      document.getElementById("gate").remove(); c.style.display = "block";
      loadVideo(k);
    } catch (x) { err.textContent = "Incorrect password."; }
  });
